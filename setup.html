<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview Setup | AI Interview Coach</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"></header><main class="container page"><div class="page-head"><h2>Set Up Your Interview</h2><p>Choose a role and experience level. Gemini will tailor the interview to your selection.</p></div><form id="setupForm" class="card"><div class="setup-grid"><section><h3>💼 Choose Your Role</h3><div class="choice-group"><div class="choice"><input id="role0" type="radio" name="role" value="Frontend Developer" ><label for="role0"><strong>Frontend Developer</strong><small>HTML, CSS, JavaScript, React and UI development.</small></label></div>
<div class="choice"><input id="role1" type="radio" name="role" value="Backend Developer" ><label for="role1"><strong>Backend Developer</strong><small>APIs, databases, servers and application logic.</small></label></div>
<div class="choice"><input id="role2" type="radio" name="role" value="Full-Stack Developer" checked><label for="role2"><strong>Full-Stack Developer</strong><small>Frontend and backend development skills.</small></label></div>
<div class="choice"><input id="role3" type="radio" name="role" value="Software Developer" ><label for="role3"><strong>Software Developer</strong><small>Programming, problem solving and software development.</small></label></div>
<div class="choice"><input id="role4" type="radio" name="role" value="Mobile App Developer" ><label for="role4"><strong>Mobile App Developer</strong><small>Android/iOS concepts and mobile application development.</small></label></div>
<div class="choice"><input id="role5" type="radio" name="role" value="AI / ML Engineer" ><label for="role5"><strong>AI / ML Engineer</strong><small>Machine learning, models and AI workflows.</small></label></div>
<div class="choice"><input id="role6" type="radio" name="role" value="Data Analyst" ><label for="role6"><strong>Data Analyst</strong><small>SQL, dashboards, data cleaning and business insights.</small></label></div>
<div class="choice"><input id="role7" type="radio" name="role" value="Data Scientist" ><label for="role7"><strong>Data Scientist</strong><small>Statistics, Python and predictive modelling.</small></label></div>
<div class="choice"><input id="role8" type="radio" name="role" value="DevOps / Cloud Engineer" ><label for="role8"><strong>DevOps / Cloud Engineer</strong><small>CI/CD, cloud, Docker and infrastructure.</small></label></div>
<div class="choice"><input id="role9" type="radio" name="role" value="Cybersecurity Analyst" ><label for="role9"><strong>Cybersecurity Analyst</strong><small>Security, vulnerabilities and incident response.</small></label></div>
<div class="choice"><input id="role10" type="radio" name="role" value="QA / Automation Tester" ><label for="role10"><strong>QA / Automation Tester</strong><small>Testing strategy and automation workflows.</small></label></div>
<div class="choice"><input id="role11" type="radio" name="role" value="UI/UX Designer" ><label for="role11"><strong>UI/UX Designer</strong><small>Research, usability, wireframes and design systems.</small></label></div>
<div class="choice"><input id="role12" type="radio" name="role" value="Product / Project Manager" ><label for="role12"><strong>Product / Project Manager</strong><small>Planning, prioritization and delivery.</small></label></div></div></section><section><h3>📈 Choose Your Experience</h3><div class="choice-group"><div class="choice"><input id="exp0" type="radio" name="experience" value="Fresher" checked><label for="exp0"><strong>🌱 Fresher</strong><small>New to the industry and starting your career.</small></label></div><div class="choice"><input id="exp1" type="radio" name="experience" value="Junior"><label for="exp1"><strong>🧑‍💻 Junior</strong><small>Some practical experience with projects.</small></label></div><div class="choice"><input id="exp2" type="radio" name="experience" value="Mid-Level"><label for="exp2"><strong>⚡ Mid-Level</strong><small>Professional experience and deeper knowledge.</small></label></div></div></section></div><div class="start-wrap"><button class="btn" type="submit">Start AI Interview →</button></div></form></main><script src="js/common.js"></script><script src="js/setup.js"></script></body></html>
